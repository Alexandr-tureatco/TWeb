<section id="loginandreg">
<h2>Вход</h2>
</section>

<div class="form-container">
  <form id="loginForm">
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Пароль" required>

    <button type="submit">Войти</button>
    
    <button type="button" id="regBtn" style="margin-top: 10px; background-color: #555;">Регистрация</button>
    
    <p id="message"></p>
  </form>
</div>

<script>
  // --- Логика Входа ---
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const formData = new FormData(e.target);

    const response = await fetch("/login", {
      method: "POST",
      body: formData
    });

    const result = await response.json();

    // Если вход успешен, перенаправляем на главную
    if (response.ok && result.redirect) {
        window.location.href = result.redirect;
    } else {
        // Если ошибка, показываем сообщение (например, "Неверный пароль")
        document.getElementById("message").innerText = result.message;
    }
  });

  // --- Логика перехода на Регистрацию ---
  document.getElementById("regBtn").addEventListener("click", () => {
    window.location.href = "/registration.html";
  });
</script>
