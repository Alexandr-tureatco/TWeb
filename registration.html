<section id="loginandreg">
<h2>Регистрация</h2>
</section>
<div class="form-container">
  <form id="registerForm">
    <input type="text" name="username" placeholder="Имя" required>
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Пароль" required>

    <button type="submit">Зарегистрироваться</button>
    <button type="button" id="loginBtn" style="margin-top: 10px; background-color: #555;">Уже есть аккаунт? Войти</button>
    
    <p id="message"></p>
  </form>
</div>

<script>
  // 1. Обработка регистрации
  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const formData = new FormData(e.target);
    const messageElement = document.getElementById("message");

    try {
      const response = await fetch("/register", {
        method: "POST",
        body: formData
      });

      const result = await response.json();
      messageElement.innerText = result.message;

      // Если регистрация успешна (код 200)
      if (response.ok && result.redirect) {
        messageElement.style.color = "green";
        setTimeout(() => {
          window.location.href = result.redirect;
        }, 1500); // Даем пользователю время прочитать "Успешно"
      } else {
        messageElement.style.color = "red";
      }
    } catch (error) {
      messageElement.innerText = "❌ Ошибка соединения с сервером";
    }
  });

  // 2. Логика кнопки "Вход" (вынесена отдельно, чтобы работала всегда)
  document.getElementById("loginBtn").addEventListener("click", () => {
    window.location.href = "/login.html"; 
  });
</script>
